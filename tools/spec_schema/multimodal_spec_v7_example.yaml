# 多模态 Spec 示例：华为云「测试用例配置」页（与 parsed_spec_v7 对应设计稿）
# 用于与 parse_ui_image 输出做双源对比评估。可由人工根据设计稿填写，或由视觉模型 API 生成。

ui_description:
  整体描述: 华为云控制台下的项目设置 - 测试用例配置页，包含顶部导航、左侧项目菜单、主内容区（功能控制开关、自定义选项表格、自定义字段表格）。
  核心功能: 开启/关闭用例权限与标记规则、精准测试开关；配置自定义枚举选项与自定义字段的中英文名称；保存/取消。
  产品场景: 企业级 DevOps/测试管理，项目管理员配置测试用例相关策略与字段。
  页面类型: console

region_decomposition:
  - 区域名称: 顶部导航栏
    区域位置: 顶部全宽
    包含组件: [Logo, 文本链接, 下拉, 按钮(新功能), 搜索框, 图标(加号/铃铛/问号), 头像]
    文案摘要: [华为云, 控制台, 华北-北京四, 首页, 工作台, 效能看板, 服务, 开源镜像站, 新功能]

  - 区域名称: 左侧边栏
    区域位置: 左侧纵向
    包含组件: [项目标题, 导航菜单项]
    文案摘要: [项目设置, DigitalCity智慧城市, 通用配置, 项目设置, 代码托管, 代码检查, 流水线, 编译构建, 部署, 发布, 运维, 测试, 服务配置, 测试用例配置, 自动任务和脚本, 其他, wiki, 文档, 私有依赖库, 资源池管理, 安全]

  - 区域名称: 主内容区
    区域位置: 中部右侧
    包含组件: [页面标题, 功能控制区块(Toggle×4), 自定义选项(表格+添加+保存/取消), 自定义字段(表格+添加+保存/取消)]
    文案摘要: [测试用例配置, 功能控制, 权限, 开启用例权限, 标记结果, 允许手动标记结果, 标记用例失败时必须输入原因, 关闭后迭代用例列表..., 精准测试, 开启精准测试, 自定义选项, 可选枚举值..., 字段名, 字段类型, 字段值, 添加, 保存, 取消, 自定义字段, 可配置定制化中英文名称..., 字段中文, 字段英文, 应用平台, Application Platform]

component_specification:
  - 组件类型: Toggle
    所在区域: 主内容区
    承载信息: 开启用例权限
    library_mapping: { recommended_component: d-toggle, mapping_confidence: high }
  - 组件类型: Toggle
    所在区域: 主内容区
    承载信息: 允许手动标记结果
  - 组件类型: Toggle
    所在区域: 主内容区
    承载信息: 标记用例失败时必须输入原因
  - 组件类型: Toggle
    所在区域: 主内容区
    承载信息: 开启精准测试
  - 组件类型: Table
    所在区域: 主内容区
    承载信息: 字段名/字段类型/字段值，含输入框与删除
  - 组件类型: Button
    所在区域: 主内容区
    承载信息: 添加, 保存, 取消
  - 组件类型: Table
    所在区域: 主内容区
    承载信息: 字段中文/字段英文
